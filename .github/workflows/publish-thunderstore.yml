name: Build and publish More Scrap Items

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check prepared release inputs
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          THUNDERSTORE_TOKEN: ${{ secrets.TCLI_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$THUNDERSTORE_TOKEN" || { echo 'Set the TCLI_AUTH_TOKEN repository secret.' >&2; exit 1; }
          python scripts/Verify-ReleaseInputs.py --tag "$RELEASE_TAG"
          python scripts/Validate-Release.py --tag "$RELEASE_TAG"

      - name: Create and validate package ZIP
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          python scripts/Package-Release.py --tag "$RELEASE_TAG"
          python scripts/Validate-Release.py --tag "$RELEASE_TAG" --zip "Builds/MoreScrapItems-${version}.zip"

      - name: Set up .NET for Thunderstore CLI
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x

      - name: Install Thunderstore CLI
        run: dotnet tool install tcli --tool-path ./.tools --version 0.2.4

      - name: Create GitHub Release and attach ZIP
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const tag = context.ref.slice('refs/tags/'.length);
            const version = tag.slice(1);
            const name = `MoreScrapItems-${version}.zip`;
            const file = path.join(process.env.GITHUB_WORKSPACE, 'Builds', name);
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({ ...context.repo, tag })).data;
            } catch (error) {
              if (error.status !== 404) throw error;
              release = (await github.rest.repos.createRelease({
                ...context.repo, tag_name: tag, name: `More Scrap Items ${version}`,
                generate_release_notes: true, draft: false, prerelease: false
              })).data;
            }
            if (!release.assets.some(asset => asset.name === name)) {
              await github.rest.repos.uploadReleaseAsset({
                ...context.repo, release_id: release.id, name,
                data: fs.readFileSync(file)
              });
            }

      - name: Publish to Thunderstore
        env:
          TCLI_AUTH_TOKEN: ${{ secrets.TCLI_AUTH_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          ./.tools/tcli publish \
            --config-path thunderstore.toml \
            --package-version "$version" \
            --file "Builds/MoreScrapItems-${version}.zip"
